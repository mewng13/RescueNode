; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gateway

[env]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Without these, PlatformIO auto-detects /dev/cu.Bluetooth-Incoming-Port and the
; upload fails with "No serial data received". The glob only matches the board.
upload_port    = /dev/cu.usbmodem*
monitor_port   = /dev/cu.usbmodem*

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder   ; turns crash addresses into line numbers
upload_speed   = 921600

; ESP32-S3 boards expose TWO usb ports:
;   "UART" -> talks through the onboard usb-serial chip
;   "USB"  -> the chip's own native usb
; This flag routes Serial over the NATIVE usb port. If you plug into the UART
; port instead and see no serial output, set this to 0.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1   ; 0 = Serial goes to the UART port; set 1 for the native USB port
	-DCORE_DEBUG_LEVEL=3

lib_deps =
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14   ; required by the DHT library

; ---------------------------------------------------------------- roles
; Two builds from one source. Pick with -e, e.g.
;     pio run -e gateway -t upload     the board on the USB cable
;     pio run -e node    -t upload     a battery node out in the rubble
;
; The gateway prints JSON for the dashboard and never rebroadcasts. A node
; broadcasts its own readings and relays everyone else's. Node ids come from
; the Wi-Fi MAC so every board can take the same binary; add -DNODE_ID=n below
; if you would rather pin them.

[env:gateway]
build_flags = ${env.build_flags} -DMESH_ROLE_GATEWAY=1

[env:node]
build_flags = ${env.build_flags} -DMESH_ROLE_GATEWAY=0

; Add more libraries here, e.g.:
;	 marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
;	 madhephaestus/ESP32Servo @ ^3.0.5
